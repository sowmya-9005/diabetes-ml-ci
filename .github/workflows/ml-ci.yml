name: Diabetes ML CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-containerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train diabetes model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline.py -v

      - name: Run prediction application tests
        run: python -m unittest test_app.py -v

      - name: Build Docker image
        run: docker build -t diabetes-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name diabetes-ml-container \
            -p 5000:5000 \
            diabetes-ml:${{ github.sha }}

      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done
          docker logs diabetes-ml-container
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"age":0.038,"sex":0.050,"bmi":0.061,"bp":0.021,"s1":-0.044,"s2":-0.034,"s3":-0.043,"s4":-0.002,"s5":0.019,"s6":-0.017}' \
            http://localhost:5000/predict)
          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp diabetes_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/
          printf "Diabetes Progression Prediction Application\nRun: python app.py\nEndpoint: POST /predict\nHealth: GET /\n" > release_candidate/DEPLOYMENT.txt

      - name: Show Docker container logs
        if: always()
        run: docker logs diabetes-ml-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f diabetes-ml-container || true

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: diabetes-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7
